services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - uploads:/app/backend/uploads
      - runs:/app/backend/detection_models/all_three/runs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ""
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads:
  runs:
