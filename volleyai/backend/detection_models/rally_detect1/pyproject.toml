[project]
name = "volleyball-cv-project"
version = "1.0.0"
description = "An automated computer vision pipeline to detect, track, and analyze volleyball rallies from video footage."
requires-python = ">=3.12"
dependencies = [
    "lap>=0.5.12",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "ultralytics>=8.3.244",
]
