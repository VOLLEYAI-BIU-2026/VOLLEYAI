services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      PORT: 5000
      CORS_ORIGINS: "http://localhost,http://frontend"
    volumes:
      - uploads:/app/backend/uploads
      - runs:/app/backend/detection_models/all_three/runs
    # ── GPU support (הסר את הבלוק הזה אם אין NVIDIA GPU) ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads:
  runs:
