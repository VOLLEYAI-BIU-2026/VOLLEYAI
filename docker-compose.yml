services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      PORT: 5000
      CORS_ORIGINS: "http://localhost,http://frontend"
    volumes:
      - ./volleyai/backend/uploads:/app/backend/uploads
      - ./volleyai/backend/detection_models/all_three/runs:/app/backend/detection_models/all_three/runs
      - torch_cache:/root/.cache/torch
      - easyocr_cache:/root/.EasyOCR

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  torch_cache:
  easyocr_cache:
